<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial; background:#f5f5f5; padding:20px;">

<div style="max-width:700px;margin:auto;background:white;border-radius:12px;overflow:hidden;">

    <div style="background:#005CAB;color:white;padding:24px;">
        <h1>FASTX TRAVELS</h1>
        <p>E-Ticket / Boarding Pass</p>
    </div>

    <div style="padding:24px;">

        <h2>
            Booking ID:
            <span th:text="${booking.bookingId}"></span>
        </h2>

        <hr>

        <h3>
            <span th:text="${booking.bus.route.origin}"></span>
            →
            <span th:text="${booking.bus.route.destination}"></span>
        </h3>

        <p>
            Passenger:
            <strong th:text="${booking.passenger.name}"></strong>
        </p>

        <p>
            Bus:
            <strong th:text="${booking.bus.name}"></strong>
        </p>

        <p>
            Seats:
            <strong th:text="${#strings.listJoin(booking.bookedSeats.![seatNo], ', ')}"></strong>
        </p>

        <p>
            Departure:
            <strong th:text="${#temporals.format(booking.bus.route.departureTime, 'yyyy-MM-dd HH:mm')}"></strong>
        </p>

        <p>
            Arrival:
            <strong th:text="${#temporals.format(booking.bus.route.departureTime.plusMinutes(booking.bus.route.durationInMinutes), 'yyyy-MM-dd HH:mm')}"></strong>
        </p>

        <div style="margin-top:30px;padding:16px;background:#f3f4f6;border-radius:10px;">
            Thank you for choosing FastX Travels.
            Have a safe journey!
        </div>

    </div>
</div>

</body>
</html>
